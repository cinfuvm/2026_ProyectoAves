openapi: 3.0.3
info:
  title: API Bitácora de Aves - Backend
  version: 1.0.0
  description: Contrato de servicios para la administración del catálogo de aves de Chile.

paths:
  /birds:
    get:
      summary: Listar catálogo de aves
      description: Recupera la lista completa de aves registradas en el sistema.
      responses:
        '200':
          description: Lista de aves obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bird'

  /birds/{id_ave}:
    get:
      summary: Obtener un ave por ID
      description: Recupera los detalles de un ave específica usando su identificador único.
      parameters:
        - name: id_ave
          in: path
          required: true
          description: Identificador numérico del ave.
          schema:
            type: integer
      responses:
        '200':
          description: Ave encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bird'
        '404':
          description: Ave no encontrada en el catálogo.

    post:
      summary: Registrar nueva ave (Solo Admin)
      description: Permite al administrador crear una nueva especie en el catálogo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirdInput'
      responses:
        '201':
          description: Ave creada exitosamente en el catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bird'
        '400':
          description: Error de validación (Parámetros faltantes o nombre científico duplicado).
        '401':
          description: No autorizado (Requiere rol de Administrador).

  /birds/{id_ave}:
    put:
      summary: Actualizar un ave existente (Solo Admin)
      description: Modifica los campos de un ave registrada previamente.
      parameters:
        - name: id_ave
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirdInput'
      responses:
        '200':
          description: Ave actualizada correctamente.
        '404':
          description: Ave no encontrada.

    delete:
      summary: Eliminar un ave del catálogo (Solo Admin)
      description: Remueve físicamente el registro de un ave mediante su ID.
      parameters:
        - name: id_ave
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Ave eliminada exitosamente (Sin contenido de retorno).
        '404':
          description: Ave no encontrada.

  /birds/ranking:
    get:
      summary: Obtener ranking de aves (Solo Admin)
      description: Muestra estadísticas de popularidad o avistamientos del catálogo de aves.
      responses:
        '200':
          description: Ranking generado correctamente.

components:
  schemas:
    Bird:
      type: object
      properties:
        id_ave:
          type: integer
          example: 1
        nombre_comun:
          type: string
          example: "Siete colores"
        nombre_cientifico:
          type: string
          example: "Tachuris rubrigastra"
        inserted_at:
          type: string
          format: date-time
          example: "2026-10-16T13:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-16T13:05:00Z"

    BirdInput:
      type: object
      required:
        - nombre_comun
        - nombre_cientifico
      properties:
        nombre_comun:
          type: string
          example: "Chucao"
        nombre_cientifico:
          type: string
          example: "Scelorchilus rubecula"

/users:
    get:
      summary: Listar todos los usuarios (Solo Admin)
      description: Recupera un listado completo de los usuarios registrados en el sistema.
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: No autorizado. Requiere rol de Administrador.

  /users/{id}:
    get:
      summary: Obtener detalles de un usuario (Solo Admin)
      description: Recupera el perfil completo de un usuario específico mediante su ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico del usuario.
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado.

    delete:
      summary: Eliminar un usuario (Solo Admin)
      description: Da de baja o elimina permanentemente a un usuario del sistema.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Usuario eliminado exitosamente.
        '404':
          description: Usuario no encontrado.

  /users/{id}/role:
    patch:
      summary: Cambiar el rol de un usuario (Solo Admin)
      description: Permite actualizar el privilegio de un usuario (ej. cambiar de 'user' a 'moderador' o 'admin').
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rol
              properties:
                rol:
                  type: string
                  enum: [user, moderador, admin]
                  example: "moderador"
      responses:
        '200':
          description: Rol actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Error de validación en el rol enviado.
        '404':
          description: Usuario no encontrado.
